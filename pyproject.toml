[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmi-pv-forecast"
version = "0.1.2"
description = "Tool for weather aware PV forecasting using forecasts from FMI."
authors = [
    { name = "Timo Salola", email = "timo.salola@fmi.fi" }
]
readme = "README.md"
license = "MIT"
license-files = ["licenses/*"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
dependencies = [
    "pandas",
    "fmiopendata",
    "pvlib",
    "numpy"
]

[project.urls]
Homepage = "https://github.com/fmidev/fmi-open-pv-forecast-packaged"


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]